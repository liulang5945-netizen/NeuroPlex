name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Native Taiji only requires torch. sentencepiece/FastAPI are installed
      # below solely so the frozen NeuroPlex regression tests remain runnable.
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        # FastAPI 可选依赖：python-multipart（form/File）—— test_api_health 触发 Form 中间件
        # 另带 pydantic+anyio（FastAPI 内部用）确保类型解析工作正常
        run: pip install sentencepiece pytest httpx fastapi python-multipart pydantic anyio

      - name: Install package (editable)
        run: pip install -e . --no-deps

      - name: Verify native Taiji end to end
        run: python -X utf8 -u scripts/training/verify_taiji_native_v5.py

      - name: Verify second-order context causality
        run: python -X utf8 -u scripts/training/verify_taiji_n7_context.py

      - name: Verify delayed trace causality
        run: python -X utf8 -u scripts/training/verify_taiji_n8_delayed_trace.py

      - name: Verify long free-running stability
        run: python -X utf8 -u scripts/training/verify_taiji_n9_long_free_run.py

      - name: Verify sparse-kernel migration
        run: python -X utf8 -u scripts/training/verify_taiji_n10_sparse_migration.py

      - name: Verify active environment learning
        run: python -X utf8 -u scripts/training/verify_taiji_n11_active_environment.py

      - name: Verify native episodic field
        run: python -X utf8 -u scripts/training/verify_taiji_m5_episodic_field.py

      - name: Verify endogenous replay consolidation
        run: python -X utf8 -u scripts/training/verify_taiji_m6_endogenous_replay.py

      - name: Run native architecture contracts
        run: python -m pytest tests/taiji_native -q

      - name: Run complete regression suite
        # Legacy real-checkpoint tests skip when local artifacts are absent.
        run: python -m pytest tests/ -q
