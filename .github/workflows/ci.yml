name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # neuroplex.resonance 核心只依赖 torch + sentencepiece（标准库之外），
      # 故 CI 不装完整 requirements（PyQt6/langchain 等与 tests 无关）。
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        run: pip install sentencepiece pytest httpx fastapi python-multipart

      - name: Install package (editable)
        run: pip install -e . --no-deps

      - name: Run population bootstrap smoke
        run: python -X utf8 -u scripts/bootstrap_population_demo.py

      - name: Run population baseline and API smoke
        run: python -X utf8 -u scripts/verify_population_baseline.py --seed 20260819

      - name: Run tests
        # 真实 ckpt 契约测试（test_real_checkpoint_slow.py）在无 data/ 时自动 skip；
        # 本地跑完整回归：python -m pytest tests/ -q（含 slow，需 data/ 产物）
        run: python -m pytest tests/ -q
