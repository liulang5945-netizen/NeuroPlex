<style id="app-shell">
/* ═══ 态极控制台 · 应用外壳（豆包设计语言） ═══ */
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--background); color: var(--foreground); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body { min-height: 100vh; }
button, input, textarea { font: inherit; color: inherit; }
button { appearance: none; cursor: pointer; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted-foreground) 28%, transparent); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--muted-foreground) 45%, transparent); }

.app { height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); background: var(--background); overflow: hidden; }

/* 侧边栏 */
.sidebar { display: flex; flex-direction: column; background: var(--sidebar); border-right: 1px solid var(--sidebar-border); min-height: 0; }
.sidebar-search { padding: 14px 14px 8px; }
.search-field { height: 38px; padding: 0 12px; border-radius: calc(var(--radius) * 0.5); background: color-mix(in srgb, var(--background) 70%, var(--sidebar)); border: 1px solid transparent; display: flex; align-items: center; gap: 9px; transition: border-color 160ms ease, background 160ms ease; }
.search-field:focus-within { border-color: var(--ring); background: var(--background); }
.search-field input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 0.86rem; }
.search-field input::placeholder { color: var(--muted-foreground); }
.kbd { display: inline-flex; align-items: center; gap: 1px; padding: 2px 6px; border-radius: 6px; background: color-mix(in srgb, var(--muted-foreground) 14%, transparent); color: var(--muted-foreground); font-size: 0.7rem; font-weight: 600; }
.icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.icon-sm { width: 15px; height: 15px; }
.nav-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.nav-item { width: 100%; border: 0; background: transparent; color: var(--sidebar-foreground); border-radius: calc(var(--radius) * 0.5); padding: 9px 11px; display: flex; align-items: center; gap: 11px; text-align: left; font-size: 0.9rem; line-height: 1.2; transition: background 140ms ease, color 140ms ease; }
.nav-item:hover { background: color-mix(in srgb, var(--background) 64%, var(--sidebar)); }
.nav-item.active { background: var(--background); color: var(--foreground); font-weight: 600; }
.nav-item .nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .icon { color: color-mix(in srgb, var(--foreground) 72%, var(--muted-foreground)); }
.nav-item.active .icon { color: var(--primary); }
.nav-shortcut { color: var(--muted-foreground); font-size: 0.72rem; opacity: 0; transition: opacity 140ms ease; }
.nav-item:hover .nav-shortcut { opacity: 1; }
.nav-section-label { padding: 14px 12px 6px; font-size: 0.74rem; color: var(--muted-foreground); }

/* 主区域 */
.main { min-width: 0; display: flex; flex-direction: column; background: var(--background); min-height: 0; }
.topbar { height: 52px; flex: none; padding: 0 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
.icon-btn { width: 34px; height: 34px; border: 0; background: transparent; color: var(--muted-foreground); border-radius: 9px; display: grid; place-items: center; transition: background 140ms ease, color 140ms ease; }
.icon-btn:hover { background: var(--muted); color: var(--foreground); }
.topbar-title { font-size: 0.92rem; font-weight: 600; }
.topbar-sub { font-size: 0.72rem; color: var(--muted-foreground); margin-top: 1px; }
.topbar-spacer { flex: 1; }

/* 品牌标识（水墨 logo + 态极文字） */
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1rem; color: var(--foreground); letter-spacing: -0.01em; }
.brand-logo { width: 28px; height: 28px; color: var(--primary); flex: none; }

/* 按钮 */
.btn { height: 36px; padding: 0 15px; border-radius: 999px; border: 1px solid transparent; display: inline-flex; align-items: center; gap: 7px; font-size: 0.86rem; font-weight: 500; transition: background 150ms ease, border-color 150ms ease, transform 120ms ease, color 150ms ease; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.btn-primary { background: var(--primary); color: var(--primary-foreground); }
.btn-primary:hover { background: color-mix(in srgb, var(--primary) 90%, var(--foreground)); }
.btn-ghost { background: var(--muted); color: var(--foreground); }
.btn-ghost:hover { background: color-mix(in srgb, var(--muted) 80%, var(--foreground) 12%); }
.btn-outline { background: var(--background); color: var(--foreground); border-color: var(--border); }
.btn-outline:hover { background: var(--muted); }

/* 滚动区 */
.scroll-area { flex: 1; min-height: 0; overflow-y: auto; }

/* 主题切换器 */
.theme-switcher { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--muted); border: 1px solid var(--border); }
.theme-chip { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.2s ease; flex-shrink: 0; }
.theme-chip:hover { transform: scale(1.15); }
.theme-chip.active { border-color: var(--foreground); transform: scale(1.1); }
.theme-chip-classic { background: linear-gradient(135deg, #1664ff, #0055ff); }
.theme-chip-dark { background: linear-gradient(135deg, #1a1f26, #5b8cff); }
.theme-chip-teal { background: linear-gradient(135deg, #14a094, #8fd9cf); }
.theme-chip-violet { background: linear-gradient(135deg, #7c3aed, #c4a3ff); }
.theme-chip-warm { background: linear-gradient(135deg, #f97316, #ffc499); }

@media (max-width: 880px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}
</style>

<script>
// 主题切换逻辑
(function(){
  function applyTheme(t){
    var html=document.documentElement;
    if(t==='dark'){ html.classList.add('dark'); html.removeAttribute('data-theme'); }
    else { html.classList.remove('dark'); if(t && t!=='classic'){ html.setAttribute('data-theme', t); } else { html.removeAttribute('data-theme'); } }
    try{ localStorage.setItem('taiji-theme', t||'classic'); }catch(e){}
    document.querySelectorAll('.theme-chip').forEach(function(c){
      c.classList.toggle('active', c.getAttribute('data-theme')===t);
    });
  }
  var saved='classic';
  try{ saved=localStorage.getItem('taiji-theme')||'classic'; }catch(e){}
  function init(){
    applyTheme(saved);
    document.querySelectorAll('.theme-chip').forEach(function(c){
      c.addEventListener('click', function(){ applyTheme(c.getAttribute('data-theme')); });
    });
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', init); }
  else { init(); }
})();
</script>
